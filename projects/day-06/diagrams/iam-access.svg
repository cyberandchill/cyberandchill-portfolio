<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-label="Two domain identities and one group-protected SMB folder"><title>Authentication and folder authorization</title><desc>Both standard accounts sign in to the joined Windows client. Authenticated share access and group-based NTFS permissions allow only the reader to open the same folder.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173024}.h{font-size:27px;font-weight:700}.n{font-size:23px;font-weight:700}.s{font-size:18px;fill:#45664e}</style><rect width="1080" height="530" rx="20" fill="#f9faf7"/><text x="35" y="45" class="h">Same domain sign-in, different folder access</text><rect x="35" y="80" width="300" height="160" rx="14" fill="#eaf1ea" stroke="#b0c3b2"/><text x="55" y="115" class="n">CyberAndChill.com</text><text x="55" y="150" class="s">DC01 · Active Directory</text><text x="55" y="183" class="s">iam-reader + iam-noaccess</text><text x="55" y="216" class="s">Both identities authenticated</text><path d="M335 160H405 M393 152L405 160L393 168" stroke="#5b7e63" stroke-width="3" fill="none"/><rect x="410" y="80" width="290" height="160" rx="14" fill="#eaf1ea" stroke="#b0c3b2"/><text x="430" y="115" class="n">CC-WIN11</text><text x="430" y="150" class="s">Domain-joined client</text><text x="430" y="183" class="s">Both standard users sign in</text><text x="430" y="216" class="s">Same share tested separately</text><path d="M700 160H760 M748 152L760 160L748 168" stroke="#5b7e63" stroke-width="3" fill="none"/><rect x="765" y="80" width="280" height="160" rx="14" fill="#eaf1ea" stroke="#b0c3b2"/><text x="785" y="115" class="n">DC01 / CCIAM</text><text x="785" y="150" class="s">One protected SMB folder</text><text x="785" y="183" class="s">Share: authenticated read</text><text x="785" y="216" class="s">NTFS: group read + execute</text><path d="M905 240V270H275V310 M905 270H795V310 M267 298L275 310L283 298 M787 298L795 310L803 298" stroke="#5b7e63" stroke-width="3" fill="none"/><rect x="55" y="315" width="440" height="125" rx="14" fill="#eaf1ea" stroke="#8aae92"/><text x="80" y="352" class="n">iam-reader: allowed</text><text x="80" y="387" class="s">Member of GG_IAM_Readers</text><text x="80" y="420" class="s">Folder listing and file read succeeded</text><rect x="575" y="315" width="440" height="125" rx="14" fill="#eaf1ea" stroke="#b0c3b2"/><text x="600" y="352" class="n">iam-noaccess: denied</text><text x="600" y="387" class="s">Not a member of GG_IAM_Readers</text><text x="600" y="420" class="s">Windows sign-in succeeds; folder denied</text><text x="35" y="493" class="s">Conceptual diagram based on recorded lab results. Administrative recovery permissions are retained.</text></svg>