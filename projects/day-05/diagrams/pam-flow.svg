<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Temporary workstation administration workflow"><title>Temporary workstation administration</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173024}.head{font-size:24px;font-weight:bold}.small{font-size:18px}</style><rect width="1100" height="420" rx="16" fill="#f9faf7"/><text x="40" y="45" class="head">Temporary privilege, automatic directory revocation</text><g fill="#eaf1ea" stroke="#91ac98" stroke-width="2"><rect x="40" y="100" width="300" height="115" rx="12"/><rect x="400" y="100" width="300" height="115" rx="12"/><rect x="760" y="100" width="300" height="115" rx="12"/></g><text x="65" y="135" class="head">midPoint</text><text x="65" y="168" class="small">Separate reviewer approval</text><text x="65" y="195" class="small">Timed assignment + native tasks</text><text x="425" y="135" class="head">Active Directory</text><text x="425" y="168" class="small">Dedicated security group</text><text x="425" y="195" class="small">Membership added / removed</text><text x="785" y="135" class="head">Windows 11</text><text x="785" y="168" class="small">One workstation only</text><text x="785" y="195" class="small">Local administrator + UAC</text><path d="M340 157H395 M382 149L395 157L382 165 M700 157H755 M742 149L755 157L742 165" stroke="#5b7e63" stroke-width="3" fill="none"/><text x="40" y="285" class="head">Denied → approved temporary access → expired → denied after fresh sign-in</text><text x="40" y="330" class="small">Directory revocation does not end sessions. Verify fresh online sign-in and cached Windows groups.</text><text x="40" y="370" class="small">Conceptual architecture. Configuration and measured results are documented separately.</text></svg>