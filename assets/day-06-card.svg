<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-label="Authentication and group authorization architecture"><title>Authentication vs Authorization</title><desc>Both standard users sign in; security group membership permits only one to read a protected folder.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:16px;letter-spacing:1px;font-weight:700;fill:#56725e}.title{font-size:43px;font-weight:700;fill:#173024}.sub{font-size:19px;fill:#58705e}.node{font-size:24px;font-weight:700;fill:#20402e;text-anchor:middle}.small{font-size:18px;fill:#586f60;text-anchor:middle}.caption{font-size:18px;fill:#45664e;text-anchor:middle}.body{font-size:22px;fill:#2f4636}.cta{font-size:19px;font-weight:700;fill:#326447}</style><rect width="760" height="850" rx="22" fill="#f9faf7"/><text x="36" y="44" class="eyebrow">CYBERANDCHILL / TECHNICAL PORTFOLIO</text><path d="M36 65H724" stroke="#d8e1d8" stroke-width="2"/><text x="36" y="128" class="title">Authentication vs</text><text x="36" y="173" class="title">Authorization</text><text x="36" y="207" class="sub">Active Directory · Windows 11 · SMB / NTFS</text><rect x="29" y="235" width="702" height="412" rx="20" fill="#eaf1ea"/><text x="48" y="268" class="eyebrow">IDENTITY FIRST, RESOURCE ACCESS SECOND</text>
<rect x="56" y="292" width="280" height="78" rx="12" fill="white" stroke="#b0c3b2" stroke-width="2"/><text x="196" y="325" class="node">Standard reader</text><text x="196" y="351" class="small">Group member</text>
<rect x="424" y="292" width="280" height="78" rx="12" fill="white" stroke="#b0c3b2" stroke-width="2"/><text x="564" y="325" class="node">Standard user</text><text x="564" y="351" class="small">Not a group member</text>
