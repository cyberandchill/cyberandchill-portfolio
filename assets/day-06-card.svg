<rect x="168" y="416" width="424" height="70" rx="12" fill="white" stroke="#b0c3b2" stroke-width="2"/><text x="380" y="445" class="node">Both sign in to Windows</text><text x="380" y="472" class="small">Active Directory authenticates identity</text>
